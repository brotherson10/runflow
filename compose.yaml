# PostgreSQL local exclusivo do RunFlow V2 (desenvolvimento e testes).
# Nome de projeto, container, volume e porta próprios: não partilha nada com
# outros projetos. As credenciais são só para uso local (não são segredos de produção).
name: runflow

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: runflow-postgres
    environment:
      POSTGRES_USER: ${RUNFLOW_DB_USER:-runflow}
      POSTGRES_PASSWORD: ${RUNFLOW_DB_PASSWORD:-runflow_local_dev}
      POSTGRES_DB: ${RUNFLOW_DB_NAME:-runflow_dev}
    ports:
      # Só em 127.0.0.1: a base não fica acessível a partir da rede.
      - "127.0.0.1:${RUNFLOW_DB_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+: o volume monta em /var/lib/postgresql (PGDATA por versão).
      - runflow_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

volumes:
  runflow_pgdata:
    name: runflow_pgdata
