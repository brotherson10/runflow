name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js (versão de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile estrito)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  # Testes com PostgreSQL real. Ainda não executado remotamente (repositório por publicar).
  database:
    name: Migrations, base de dados e autenticação (HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          # Credenciais efémeras, só para este job de CI.
          POSTGRES_USER: runflow
          POSTGRES_PASSWORD: runflow_ci
          POSTGRES_DB: runflow_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U runflow -d runflow_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://runflow:runflow_ci@localhost:55432/runflow_dev
      TEST_DATABASE_URL: postgres://runflow:runflow_ci@localhost:55432/runflow_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js (versão de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile estrito)
        run: npm ci

      - name: Migrations consistentes (drizzle-kit check)
        run: npm run db:check

      - name: Schema sem alterações por gerar
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- apps/api/drizzle)" ]; then
            echo "O schema Drizzle mudou sem migration versionada. Corra npm run db:generate."
            git status --porcelain -- apps/api/drizzle
            exit 1
          fi

      - name: Aplicar migrations (base de desenvolvimento do CI)
        run: npm run db:migrate

      - name: Testes de base de dados e de autenticação (PostgreSQL real)
        run: npm run test:db

  # E2E com a API e a web reais sobre PostgreSQL de testes. Ainda não executado
  # remotamente (repositório por publicar). Usa o Google Chrome já instalado na
  # imagem ubuntu do GitHub (canal "chrome" do Playwright): não descarrega browsers.
  e2e:
    name: E2E (Playwright, Chrome, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          # Credenciais efémeras, só para este job de CI.
          POSTGRES_USER: runflow
          POSTGRES_PASSWORD: runflow_ci
          POSTGRES_DB: runflow_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U runflow -d runflow_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Nome terminado em _test e host local: exigidos pela proteção de e2e/prepare-db.ts.
      E2E_DATABASE_URL: postgres://runflow:runflow_ci@localhost:55432/runflow_e2e_test
      E2E_SCREENSHOT_DIR: .e2e/screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js (versão de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile estrito)
        run: npm ci

      - name: Versão do Chrome
        run: google-chrome --version

      - name: E2E
        run: npm run test:e2e

      # Só em falhas: traces e capturas do Playwright, relatório HTML e as capturas
      # de acessibilidade. Não inclui .e2e/mail (links de redefinição, ainda que fictícios).
      - name: Artefactos dos E2E (falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-falha-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            .e2e/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
